services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  migrate:
    image: migrate/migrate:v4.19.1
    command:
      ["-path", "/migrations", "-database", "postgres://expense_user:${POSTGRES_PASSWORD}@db:5432/expense_tracker?sslmode=disable", "up"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro

  api:
    build: .
    environment:
      DATABASE_URL: postgres://expense_user:${POSTGRES_PASSWORD}@db:5432/expense_tracker?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: 8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

volumes:
  postgres_data:
